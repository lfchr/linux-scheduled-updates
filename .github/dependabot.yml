version: 2

updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "* * * * 2,5"
    cooldown:
      default-days: 0
      include:
        - "fedora/fedora-bootc"
    ignore:
      - dependency-name: "fedora/fedora-bootc"
        versions: [">= 45"]
